<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D5BT — Button Lab</title>
<style>
:root{--bg:#070b12;--panel:#0e1522;--line:#26344d;--text:#f5f7fb;--muted:#909db1}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -10%,#17223d 0,#0a101b 34%,#070b12 72%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #182238;background:#090e18}.brand{font-weight:850;font-size:19px}.status{font-size:12px;color:var(--muted)}
main{max-width:1160px;margin:auto;padding:18px 12px 50px}.panel{background:linear-gradient(180deg,#101826,#0a111c);border:1px solid var(--line);border-radius:16px;padding:15px}.section-title{font-size:12px;font-weight:850;letter-spacing:.8px;text-transform:uppercase;color:#dbe3ef;margin:0 0 10px}
.brands,.models{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.models{margin-top:9px}.brand-btn,.model-btn{min-height:44px;border-radius:11px;border:1px solid #2b3953;background:#111a2a;color:#c7d1df;font-weight:750;cursor:pointer}.active{border-color:#8c7cff!important;background:#211b47!important;color:#fff!important;box-shadow:0 0 0 3px rgba(112,92,255,.15)}
.workspace{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:14px;margin-top:14px}.preview-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.model-name{font-weight:800;font-size:18px}.hint{font-size:11px;color:var(--muted)}
.stage{position:relative;min-height:620px;margin-top:10px;border:1px solid #1d2940;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 58% 38%,rgba(112,92,255,.10),transparent 52%)}.controller-grid{position:absolute;inset:24px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));gap:4px;overflow:visible}.controller-grid.show-grid{background-image:linear-gradient(to right,rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.055) 1px,transparent 1px);background-size:calc(100%/12) calc(100%/12)}
.face,.sys,.touchpad,.dpad{position:relative;align-self:center;justify-self:center;border:0;background:transparent;padding:0;cursor:pointer;z-index:2;overflow:visible}.face{width:76px;height:76px}.sys{width:82px;height:56px}.touchpad{width:220px;height:110px;display:none}.dpad{width:155px;height:155px}.face object,.sys object,.touchpad object,.dpad object{width:100%;height:100%;display:block;pointer-events:none;transform-origin:center;transition:transform .12s ease}.item-state{position:absolute;left:50%;top:calc(100% + 2px);transform:translateX(-50%);font-size:8px;color:#9ba8ba;white-space:nowrap;background:#0b1320;border:1px solid #27354d;border-radius:6px;padding:2px 5px;pointer-events:none}.sys-label{position:absolute;left:50%;top:calc(100% + 19px);transform:translateX(-50%);font-size:9px;color:#9ba8ba;white-space:nowrap;pointer-events:none}.stage-note{position:absolute;left:12px;bottom:10px;color:#69778d;font-size:10px}
.sidebar{display:grid;gap:12px;align-content:start}.color{width:100%;height:46px;border:1px solid #2c3b55;background:#111827;border-radius:10px;padding:4px}.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}.sw{aspect-ratio:1;border-radius:50%;border:2px solid #455066}.legend{display:grid;gap:6px}.legend div{padding:8px;border:1px solid #22304a;border-radius:8px;background:#0b1320;font-size:11px;color:#aab5c6}.toggle{width:100%;min-height:42px;border-radius:10px;border:1px solid #2b3953;background:#111a2a;color:#d7deea;font-weight:750}.code{font:10px ui-monospace,monospace;color:#b9c4d4;background:#080e18;border:1px solid #202c44;border-radius:9px;padding:9px;white-space:pre-wrap;max-height:260px;overflow:auto}
@media(max-width:820px){.brands,.models{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.stage{min-height:560px}.controller-grid{inset:16px;gap:2px}.face{width:64px;height:64px}.sys{width:70px;height:48px}.touchpad{width:180px;height:90px}.dpad{width:125px;height:125px}}
</style>
</head>
<body>
<header><div class="brand">D5BT BUTTON LAB</div><div class="status">12×12 virtual grid</div></header>
<main>
<section class="panel"><div class="section-title">Фирма</div><div class="brands" id="brands"><button class="brand-btn active" data-brand="playstation">PlayStation</button><button class="brand-btn" data-brand="xbox">Xbox</button><button class="brand-btn" data-brand="nintendo">Nintendo</button><button class="brand-btn" data-brand="custom">Custom</button></div><div class="models" id="models"></div></section>
<section class="workspace">
<div class="panel"><div class="preview-head"><div><div class="section-title">Сцена кнопок</div><div id="modelName" class="model-name"></div></div><div class="hint">idle → pressed → error</div></div>
<div class="stage"><div id="controllerGrid" class="controller-grid">
<button id="dpad" class="dpad"><object data="assets/dpad.svg" type="image/svg+xml"></object><span class="item-state">idle</span></button>
<button class="face" data-face="0"><object data="assets/face-button.svg" type="image/svg+xml"></object><span class="item-state">idle</span></button>
<button class="face" data-face="1"><object data="assets/face-button.svg" type="image/svg+xml"></object><span class="item-state">idle</span></button>
<button class="face" data-face="2"><object data="assets/face-button.svg" type="image/svg+xml"></object><span class="item-state">idle</span></button>
<button class="face" data-face="3"><object data="assets/face-button.svg" type="image/svg+xml"></object><span class="item-state">idle</span></button>
<button id="touchpad" class="touchpad"><object data="assets/touchpad.svg" type="image/svg+xml"></object><span class="item-state">idle</span></button><div id="systems" style="display:contents"></div></div><div class="stage-note">Занятая область сетки не может принадлежать двум элементам</div></div></div>
<aside class="sidebar"><section class="panel"><div class="section-title">Общий цвет кнопок / D-pad / touchpad</div><input id="bodyColor" class="color" type="color" value="#24272e"><div id="quick" class="quick"></div></section><section class="panel"><div class="section-title">Сетка</div><button id="gridToggle" class="toggle">Показать сетку 12×12</button></section><section class="panel"><div class="section-title">Состояния</div><div class="legend"><div><b>idle</b> обычное</div><div><b>pressed</b> нажатие</div><div><b>error</b> красная ошибка</div></div></section><section class="panel"><div class="section-title">Конфиг</div><div id="config" class="code"></div></section></aside>
</section></main>
<script>
(()=>{
const STATES=['idle','pressed','error'];
const M={
 playstation:{ps4:{name:'PS4 · DualShock 4',dpad:'ps4',fill:'#24272e',edge:'#555b66',colors:['#49d09d','#e9576b','#5f96ff','#e98adf'],symbols:['triangle','circle','cross','square'],face:[[10,3],[11,4],[10,5],[9,4]],touch:{c:5,r:2,cs:4,rs:3},systems:[{kind:'share',shape:'vertical',c:4,r:2,label:'Share'},{kind:'options',shape:'vertical',c:9,r:2,label:'Options'},{kind:'system',shape:'circle',c:6,r:6,label:'PS'}]},ps5:{name:'PS5 · DualSense',dpad:'ps5',fill:'#eef1f5',edge:'#c7ccd4',colors:['#2f343c','#2f343c','#2f343c','#2f343c'],symbols:['triangle','circle','cross','square'],face:[[10,3],[11,4],[10,5],[9,4]],touch:{c:5,r:2,cs:4,rs:3},systems:[{kind:'share',shape:'vertical',c:4,r:2,label:'Create'},{kind:'options',shape:'vertical',c:9,r:2,label:'Options'},{kind:'system',shape:'small',c:6,r:6,label:'PS'},{kind:'mute',shape:'small',c:6,r:8,label:'Mute'}]}},
 xbox:{x360:{name:'Xbox 360',dpad:'xbox360',fill:'#171a1f',edge:'#4b525d',colors:['#f2c21c','#e8453c','#55b24c','#3c8fe3'],symbols:['y','b','a','x'],face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'guide',shape:'circle',c:6,r:4,label:'Guide',size:1.5},{kind:'share',shape:'pill',c:5,r:7,cs:2,label:'Back'},{kind:'options',shape:'pill',c:7,r:7,cs:2,label:'Start'}]},one:{name:'Xbox One',dpad:'xboxOne',fill:'#171a1f',edge:'#4b525d',colors:['#f2c21c','#e8453c','#55b24c','#3c8fe3'],symbols:['y','b','a','x'],face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'guide',shape:'circle',c:6,r:3,label:'Guide',size:1.5},{kind:'share',shape:'pill',c:5,r:7,cs:2,label:'View'},{kind:'options',shape:'pill',c:7,r:7,cs:2,label:'Menu'}]},series:{name:'Xbox Series X|S',dpad:'xboxSeries',fill:'#171a1f',edge:'#4b525d',colors:['#f2c21c','#e8453c','#55b24c','#3c8fe3'],symbols:['y','b','a','x'],face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'guide',shape:'circle',c:6,r:2,label:'Guide',size:1.5},{kind:'share',shape:'pill',c:5,r:7,cs:2,label:'View'},{kind:'options',shape:'pill',c:7,r:7,cs:2,label:'Menu'},{kind:'share',shape:'small',c:6,r:9,label:'Share'}]},elite:{name:'Xbox Elite',dpad:'xboxElite',fill:'#16191e',edge:'#59616d',colors:['#e8eaed','#e8eaed','#e8eaed','#e8eaed'],symbols:['y','b','a','x'],face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'guide',shape:'circle',c:6,r:2,label:'Guide',size:1.5},{kind:'share',shape:'pill',c:5,r:7,cs:2,label:'View'},{kind:'options',shape:'pill',c:7,r:7,cs:2,label:'Menu'},{kind:'share',shape:'small',c:6,r:9,label:'Share'}]}},
 nintendo:{joycon:{name:'Nintendo Joy-Con',dpad:'joycon',fill:'#20242a',edge:'#5b626d',colors:['#fff','#fff','#fff','#fff'],symbols:['x','a','b','y'],face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'minus',shape:'pill',c:5,r:2,cs:2,label:'−'},{kind:'plus',shape:'pill',c:7,r:2,cs:2,label:'+'},{kind:'system',shape:'small',c:5,r:9,label:'Home'},{kind:'capture',shape:'small',c:7,r:9,label:'Capture'}]},pro:{name:'Nintendo Pro Controller',dpad:'nintendoPro',fill:'#24272d',edge:'#59616b',colors:['#fff','#fff','#fff','#fff'],symbols:['x','a','b','y'],face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'minus',shape:'pill',c:5,r:4,cs:2,label:'−'},{kind:'plus',shape:'pill',c:7,r:4,cs:2,label:'+'},{kind:'system',shape:'small',c:5,r:9,label:'Home'},{kind:'capture',shape:'small',c:7,r:9,label:'Capture'}]}},
 custom:{custom:{name:'Custom',dpad:'custom',fill:'#735cff',edge:'#a99cff',colors:['#fff','#fff','#fff','#fff'],symbols:['y','b','a','x'],face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'system',shape:'circle',c:6,r:4,label:'System'},{kind:'share',shape:'pill',c:5,r:8,cs:2,label:'Share'},{kind:'options',shape:'pill',c:7,r:8,cs:2,label:'Options'}]}}
};
const labels={playstation:[['ps4','PS4'],['ps5','PS5']],xbox:[['x360','Xbox 360'],['one','Xbox One'],['series','Series X|S'],['elite','Elite']],nintendo:[['joycon','Joy-Con'],['pro','Pro Controller']],custom:[['custom','Custom']]};
let brand='playstation',model='ps4',custom=null,faceStates=['idle','idle','idle','idle'],systemStates=[],touchState='idle',dpadState='idle',dpadDir='none',occupied=new Map(),moves=[];
const faces=[...document.querySelectorAll('.face')],systems=document.getElementById('systems'),touchpad=document.getElementById('touchpad'),dpad=document.getElementById('dpad'),color=document.getElementById('bodyColor'),config=document.getElementById('config'),name=document.getElementById('modelName'),grid=document.getElementById('controllerGrid');const C=()=>M[brand][model],body=()=>custom||C().fill;
function cells(c,r,cs=1,rs=1){const a=[];for(let y=r;y<r+rs;y++)for(let x=c;x<c+cs;x++)a.push(`${x}:${y}`);return a}function free(c,r,cs=1,rs=1){return c>=1&&r>=1&&c+cs-1<=12&&r+rs-1<=12&&cells(c,r,cs,rs).every(k=>!occupied.has(k))}function reserve(c,r,cs,rs,id){cells(c,r,cs,rs).forEach(k=>occupied.set(k,id))}function nearest(c,r,cs,rs){for(let d=0;d<24;d++)for(let y=1;y<=12-rs+1;y++)for(let x=1;x<=12-cs+1;x++)if(Math.abs(x-c)+Math.abs(y-r)===d&&free(x,y,cs,rs))return[x,y];return[c,r]}function place(el,c,r,cs=1,rs=1,id='button'){let x=c,y=r;if(!free(c,r,cs,rs)){[x,y]=nearest(c,r,cs,rs);moves.push({id,from:[c,r],to:[x,y]})}reserve(x,y,cs,rs,id);el.style.gridColumn=`${x}/span ${cs}`;el.style.gridRow=`${y}/span ${rs}`;el.dataset.gridCol=x;el.dataset.gridRow=y}
function renderSystems(){systems.innerHTML='';systemStates=C().systems.map(()=> 'idle');C().systems.forEach((s,i)=>{const b=document.createElement('button');b.className='sys';b.innerHTML=`<object data="assets/system-button.svg" type="image/svg+xml"></object><span class="item-state">idle</span><span class="sys-label">${s.label}</span>`;systems.appendChild(b);b.onclick=()=>{systemStates[i]=STATES[(STATES.indexOf(systemStates[i])+1)%3];applySystem(b,i);showConfig()};b.querySelector('object').onload=()=>applySystem(b,i)})}
function layout(){occupied=new Map();moves=[];place(dpad,2,4,3,3,'dpad');C().face.forEach((p,i)=>place(faces[i],p[0],p[1],1,1,`face:${C().symbols[i]}`));if(C().touch){touchpad.style.display='block';const t=C().touch;place(touchpad,t.c,t.r,t.cs,t.rs,'touchpad')}else touchpad.style.display='none';[...systems.querySelectorAll('.sys')].forEach((b,i)=>{const s=C().systems[i];place(b,s.c,s.r,s.cs||1,s.rs||1,`system:${s.label}`)})}
function applyFace(i){const o=faces[i].querySelector('object');o.contentWindow?.postMessage({type:'D5BT_FACE_BUTTON',symbol:C().symbols[i],fill:body(),edge:C().edge,symbolColor:C().colors[i],glow:C().colors[i],state:faceStates[i],errorColor:'#ff3b30'},'*');faces[i].querySelector('.item-state').textContent=faceStates[i]}
function applySystem(b,i){const s=C().systems[i],o=b.querySelector('object');o.style.transform=`scale(${s.size||1})`;o.contentWindow?.postMessage({type:'D5BT_SYSTEM_BUTTON',kind:s.kind,shape:s.shape,state:systemStates[i],fill:body(),edge:C().edge,iconColor:C().colors[0],glow:C().colors[0],errorColor:'#ff3b30'},'*');b.querySelector('.item-state').textContent=systemStates[i]}
function applyTouch(){if(!C().touch)return;const o=touchpad.querySelector('object');o.contentWindow?.postMessage({type:'D5BT_TOUCHPAD',controller:model,state:touchState,fill:body(),edge:C().edge,accent:C().colors[0],errorColor:'#ff3b30'},'*');touchpad.querySelector('.item-state').textContent=touchState}
function applyDpad(){const o=dpad.querySelector('object');o.contentWindow?.postMessage({type:'D5BT_DPAD',controller:C().dpad,direction:dpadDir,state:dpadState,fill:body(),edgeColor:C().edge,pressedColor:'#ffffff',errorColor:'#ff3b30'},'*');dpad.querySelector('.item-state').textContent=dpadState+(dpadDir!=='none'?` · ${dpadDir}`:'')}
function applyAll(){name.textContent=C().name;layout();faces.forEach((_,i)=>applyFace(i));applyTouch();applyDpad();[...systems.querySelectorAll('.sys')].forEach((b,i)=>applySystem(b,i));showConfig()}
function showConfig(){config.textContent=JSON.stringify({grid:'12x12',brand,model:C().name,color:body(),dpad:{preset:C().dpad,state:dpadState,direction:dpadDir,actual:[+dpad.dataset.gridCol,+dpad.dataset.gridRow]},touchpad:C().touch?{...C().touch,state:touchState}:null,movedConflicts:moves},null,2)}
function renderModels(){const box=document.getElementById('models');box.innerHTML='';labels[brand].forEach(([k,t])=>{const b=document.createElement('button');b.className='model-btn'+(k===model?' active':'');b.textContent=t;b.onclick=()=>{model=k;reset();color.value=C().fill;renderModels();renderSystems();applyAll()};box.appendChild(b)})}
function reset(){custom=null;faceStates.fill('idle');touchState='idle';dpadState='idle';dpadDir='none'}
faces.forEach((b,i)=>{b.onclick=()=>{faceStates[i]=STATES[(STATES.indexOf(faceStates[i])+1)%3];applyFace(i);showConfig()};b.querySelector('object').onload=()=>applyFace(i)});touchpad.onclick=()=>{if(!C().touch)return;touchState=STATES[(STATES.indexOf(touchState)+1)%3];applyTouch();showConfig()};touchpad.querySelector('object').onload=applyTouch;
dpad.onclick=e=>{const r=dpad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;dpadDir=Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up');dpadState=STATES[(STATES.indexOf(dpadState)+1)%3];if(dpadState==='idle')dpadDir='none';applyDpad();showConfig()};dpad.querySelector('object').onload=applyDpad;
document.getElementById('brands').onclick=e=>{const b=e.target.closest('[data-brand]');if(!b)return;brand=b.dataset.brand;model=labels[brand][0][0];reset();document.querySelectorAll('.brand-btn').forEach(x=>x.classList.toggle('active',x===b));color.value=C().fill;renderModels();renderSystems();applyAll()};color.oninput=()=>{custom=color.value;applyAll()};document.getElementById('gridToggle').onclick=()=>{grid.classList.toggle('show-grid');document.getElementById('gridToggle').textContent=grid.classList.contains('show-grid')?'Скрыть сетку 12×12':'Показать сетку 12×12'};
['#f1f3f6','#24272e','#171a1f','#2f7fd7','#55b24c','#e8453c','#ffd21c','#735cff','#e60012','#9aa4b2','#ff6b9d','#24c7d9'].forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=()=>{color.value=c;custom=c;applyAll()};document.getElementById('quick').appendChild(b)});renderModels();renderSystems();applyAll();
})();
</script>
</body>
</html>
