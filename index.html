<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D5BT — Button Lab</title>
<style>
:root{--bg:#070b12;--panel:#0e1522;--line:#26344d;--text:#f5f7fb;--muted:#909db1;--accent:#705cff}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -10%,#17223d 0,#0a101b 34%,#070b12 72%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #182238;background:#090e18}.brand{font-weight:850;font-size:19px}.status{font-size:12px;color:var(--muted)}main{max-width:1160px;margin:auto;padding:18px 12px 50px}.panel{background:linear-gradient(180deg,#101826,#0a111c);border:1px solid var(--line);border-radius:16px;padding:15px}.section-title{font-size:12px;font-weight:850;letter-spacing:.8px;text-transform:uppercase;color:#dbe3ef;margin:0 0 10px}.brands,.models{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.models{margin-top:9px}.brand-btn,.model-btn{min-height:44px;border-radius:11px;border:1px solid #2b3953;background:#111a2a;color:#c7d1df;font-weight:750;cursor:pointer}.active{border-color:#8c7cff!important;background:#211b47!important;color:#fff!important;box-shadow:0 0 0 3px rgba(112,92,255,.15)}.workspace{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:14px;margin-top:14px}.preview-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.model-name{font-weight:800;font-size:18px}.hint{font-size:11px;color:var(--muted)}.stage{position:relative;min-height:620px;margin-top:10px;border:1px solid #1d2940;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 58% 38%,rgba(112,92,255,.10),transparent 52%)}.controller-grid{position:absolute;inset:24px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));gap:4px}.controller-grid.show-grid{background-image:linear-gradient(to right,rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.045) 1px,transparent 1px);background-size:calc(100% / 12) calc(100% / 12)}.face,.sys{position:relative;align-self:center;justify-self:center;border:0;background:transparent;padding:0;cursor:pointer;z-index:2}.face{width:min(100%,92px);aspect-ratio:1}.face object,.sys object{width:100%;height:100%;display:block;pointer-events:none}.sys{width:min(100%,96px);height:min(100%,64px)}.sys-label{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:9px;color:#9ba8ba;white-space:nowrap}.state-dot{position:absolute;right:2px;top:2px;padding:3px 5px;border-radius:6px;background:#0b1320;border:1px solid #27354d;font-size:8px;color:#aab6c7}.stage-note{position:absolute;left:12px;bottom:10px;color:#69778d;font-size:10px}.sidebar{display:grid;gap:12px;align-content:start}.color{width:100%;height:46px;border:1px solid #2c3b55;background:#111827;border-radius:10px;padding:4px}.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}.sw{aspect-ratio:1;border-radius:50%;border:2px solid #455066}.legend{display:grid;gap:6px}.legend div{padding:8px;border:1px solid #22304a;border-radius:8px;background:#0b1320;font-size:11px;color:#aab5c6}.toggle{width:100%;min-height:42px;border-radius:10px;border:1px solid #2b3953;background:#111a2a;color:#d7deea;font-weight:750}.code{font:10px ui-monospace,monospace;color:#b9c4d4;background:#080e18;border:1px solid #202c44;border-radius:9px;padding:9px;white-space:pre-wrap;max-height:260px;overflow:auto}@media(max-width:820px){.brands,.models{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.stage{min-height:560px}.controller-grid{inset:16px;gap:2px}.face{width:min(100%,74px)}.sys{width:min(100%,78px);height:min(100%,54px)}}
</style>
</head><body>
<header><div class="brand">D5BT BUTTON LAB</div><div class="status">12×12 virtual grid</div></header>
<main>
<section class="panel"><div class="section-title">Фирма</div><div class="brands" id="brands"><button class="brand-btn active" data-brand="playstation">PlayStation</button><button class="brand-btn" data-brand="xbox">Xbox</button><button class="brand-btn" data-brand="nintendo">Nintendo</button><button class="brand-btn" data-brand="custom">Custom</button></div><div class="models" id="models"></div></section>
<section class="workspace"><div class="panel"><div class="preview-head"><div><div class="section-title">Сцена кнопок</div><div id="modelName" class="model-name"></div></div><div class="hint">idle → pressed → error</div></div><div class="stage"><div id="controllerGrid" class="controller-grid"><button class="face" data-face="0"><object data="assets/face-button.svg" type="image/svg+xml"></object><span class="state-dot">idle</span></button><button class="face" data-face="1"><object data="assets/face-button.svg" type="image/svg+xml"></object><span class="state-dot">idle</span></button><button class="face" data-face="2"><object data="assets/face-button.svg" type="image/svg+xml"></object><span class="state-dot">idle</span></button><button class="face" data-face="3"><object data="assets/face-button.svg" type="image/svg+xml"></object><span class="state-dot">idle</span></button><div id="systems" style="display:contents"></div></div><div class="stage-note">Сетка виртуальная: кнопки стоят по модельным координатам</div></div></div><aside class="sidebar"><section class="panel"><div class="section-title">Цвет корпуса кнопок</div><input id="bodyColor" class="color" type="color" value="#24272e"><div id="quick" class="quick"></div></section><section class="panel"><div class="section-title">Сетка</div><button id="gridToggle" class="toggle" type="button">Показать сетку 12×12</button></section><section class="panel"><div class="section-title">Состояния</div><div class="legend"><div><b>idle</b> обычное</div><div><b>pressed</b> нажатие</div><div><b>error</b> красная ошибка</div></div></section><section class="panel"><div class="section-title">Конфиг</div><div id="config" class="code"></div></section></aside></section>
</main>
<script>
(()=>{const S=['idle','pressed','error'];const M={
playstation:{ps4:{name:'PS4 · DualShock 4',symbols:['triangle','circle','cross','square'],fill:'#24272e',edge:'#555b66',colors:['#49d09d','#e9576b','#5f96ff','#e98adf'],glow:'#5f96ff',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'share',shape:'pill',c:4,r:4,cs:2,label:'Share'},{kind:'options',shape:'pill',c:7,r:4,cs:2,label:'Options'},{kind:'system',shape:'circle',c:6,r:8,label:'PS'}]},ps5:{name:'PS5 · DualSense',symbols:['triangle','circle','cross','square'],fill:'#eef1f5',edge:'#c7ccd4',colors:['#2f343c','#2f343c','#2f343c','#2f343c'],glow:'#7c8cff',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'share',shape:'pill',c:4,r:4,cs:2,label:'Create'},{kind:'options',shape:'pill',c:7,r:4,cs:2,label:'Options'},{kind:'system',shape:'small',c:6,r:8,label:'PS'},{kind:'mute',shape:'pill',c:6,r:10,cs:2,label:'Mute'}]}},
xbox:{x360:{name:'Xbox 360',symbols:['y','b','a','x'],fill:'#171a1f',edge:'#4b525d',colors:['#f2c21c','#e8453c','#55b24c','#3c8fe3'],glow:'#65b94f',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'guide',shape:'circle',c:5,r:6,label:'Guide'},{kind:'share',shape:'pill',c:3,r:8,cs:2,label:'Back'},{kind:'options',shape:'pill',c:6,r:8,cs:2,label:'Start'}]},one:{name:'Xbox One',symbols:['y','b','a','x'],fill:'#171a1f',edge:'#4b525d',colors:['#f2c21c','#e8453c','#55b24c','#3c8fe3'],glow:'#65b94f',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'guide',shape:'circle',c:5,r:4,label:'Guide'},{kind:'share',shape:'pill',c:3,r:7,cs:2,label:'View'},{kind:'options',shape:'pill',c:6,r:7,cs:2,label:'Menu'}]},series:{name:'Xbox Series X|S',symbols:['y','b','a','x'],fill:'#171a1f',edge:'#4b525d',colors:['#f2c21c','#e8453c','#55b24c','#3c8fe3'],glow:'#65b94f',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'guide',shape:'circle',c:5,r:3,label:'Guide'},{kind:'share',shape:'pill',c:3,r:7,cs:2,label:'View'},{kind:'options',shape:'pill',c:6,r:7,cs:2,label:'Menu'},{kind:'share',shape:'small',c:5,r:9,label:'Share'}]},elite:{name:'Xbox Elite',symbols:['y','b','a','x'],fill:'#16191e',edge:'#59616d',colors:['#e8eaed','#e8eaed','#e8eaed','#e8eaed'],glow:'#9aa4b2',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'guide',shape:'circle',c:5,r:3,label:'Guide'},{kind:'share',shape:'pill',c:3,r:7,cs:2,label:'View'},{kind:'options',shape:'pill',c:6,r:7,cs:2,label:'Menu'},{kind:'share',shape:'small',c:5,r:9,label:'Share'}]}},
nintendo:{joycon:{name:'Nintendo Joy‑Con',symbols:['x','a','b','y'],fill:'#20242a',edge:'#5b626d',colors:['#fff','#fff','#fff','#fff'],glow:'#e60012',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'minus',shape:'pill',c:2,r:2,cs:2,label:'−'},{kind:'plus',shape:'pill',c:6,r:2,cs:2,label:'+'},{kind:'system',shape:'small',c:3,r:9,label:'Home'},{kind:'capture',shape:'small',c:6,r:9,label:'Capture'}]},pro:{name:'Nintendo Pro Controller',symbols:['x','a','b','y'],fill:'#24272d',edge:'#59616b',colors:['#fff','#fff','#fff','#fff'],glow:'#e60012',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'minus',shape:'pill',c:3,r:5,cs:2,label:'−'},{kind:'plus',shape:'pill',c:6,r:5,cs:2,label:'+'},{kind:'system',shape:'small',c:3,r:9,label:'Home'},{kind:'capture',shape:'small',c:6,r:9,label:'Capture'}]}},custom:{custom:{name:'Custom',symbols:['y','b','a','x'],fill:'#735cff',edge:'#a99cff',colors:['#fff','#fff','#fff','#fff'],glow:'#a99cff',face:[[9,3],[11,5],[9,7],[7,5]],systems:[{kind:'system',shape:'circle',c:5,r:6,label:'System'},{kind:'share',shape:'pill',c:3,r:9,cs:2,label:'Share'},{kind:'options',shape:'pill',c:6,r:9,cs:2,label:'Options'}]}}};
const labels={playstation:[['ps4','PS4'],['ps5','PS5']],xbox:[['x360','Xbox 360'],['one','Xbox One'],['series','Series X|S'],['elite','Elite']],nintendo:[['joycon','Joy-Con'],['pro','Pro Controller']],custom:[['custom','Custom']]};let brand='playstation',model='ps4',custom=null,fs=['idle','idle','idle','idle'],ss=[];const faces=[...document.querySelectorAll('.face')],systems=document.getElementById('systems'),color=document.getElementById('bodyColor'),config=document.getElementById('config'),name=document.getElementById('modelName'),grid=document.getElementById('controllerGrid');const C=()=>M[brand][model];
function place(el,c,r,cs=1,rs=1){el.style.gridColumn=`${c} / span ${cs}`;el.style.gridRow=`${r} / span ${rs}`}
function pf(i){const o=faces[i].querySelector('object'),p=C().face[i];place(faces[i],p[0],p[1]);if(o.contentWindow)o.contentWindow.postMessage({type:'D5BT_FACE_BUTTON',symbol:C().symbols[i],fill:custom||C().fill,edge:C().edge,symbolColor:C().colors[i],glow:C().glow,state:fs[i],errorColor:'#ff3b30'},'*');faces[i].querySelector('.state-dot').textContent=fs[i]}
function ps(b,i){const s=C().systems[i],o=b.querySelector('object');place(b,s.c,s.r,s.cs||1,s.rs||1);if(o.contentWindow)o.contentWindow.postMessage({type:'D5BT_SYSTEM_BUTTON',kind:s.kind,shape:s.shape,state:ss[i],fill:custom||C().fill,edge:C().edge,iconColor:C().colors[0],glow:C().glow,errorColor:'#ff3b30'},'*');b.querySelector('.state-dot').textContent=ss[i]}
function rs(){systems.innerHTML='';ss=C().systems.map(()=> 'idle');C().systems.forEach((s,i)=>{const b=document.createElement('button');b.className='sys';b.innerHTML=`<object data="assets/system-button.svg" type="image/svg+xml"></object><span class="sys-label">${s.label}</span><span class="state-dot">idle</span>`;systems.appendChild(b);b.onclick=()=>{ss[i]=S[(S.indexOf(ss[i])+1)%3];ps(b,i);rc()};b.querySelector('object').onload=()=>ps(b,i)})}
function rm(){const box=document.getElementById('models');box.innerHTML='';labels[brand].forEach(([k,t])=>{const b=document.createElement('button');b.className='model-btn'+(k===model?' active':'');b.textContent=t;b.onclick=()=>{model=k;custom=null;fs.fill('idle');color.value=C().fill;rm();rs();all()};box.appendChild(b)})}
function rc(){config.textContent=JSON.stringify({grid:'12x12',brand,model:C().name,face:C().face.map((p,i)=>({symbol:C().symbols[i],col:p[0],row:p[1],state:fs[i]})),systems:C().systems.map((s,i)=>({...s,state:ss[i]}))},null,2)}function all(){name.textContent=C().name;faces.forEach((_,i)=>pf(i));[...systems.querySelectorAll('.sys')].forEach((b,i)=>ps(b,i));rc()}
faces.forEach((b,i)=>{b.onclick=()=>{fs[i]=S[(S.indexOf(fs[i])+1)%3];pf(i);rc()};b.querySelector('object').onload=()=>pf(i)});document.getElementById('brands').onclick=e=>{const b=e.target.closest('[data-brand]');if(!b)return;brand=b.dataset.brand;model=labels[brand][0][0];custom=null;fs.fill('idle');document.querySelectorAll('.brand-btn').forEach(x=>x.classList.toggle('active',x===b));color.value=C().fill;rm();rs();all()};color.oninput=()=>{custom=color.value;all()};document.getElementById('gridToggle').onclick=()=>{grid.classList.toggle('show-grid');document.getElementById('gridToggle').textContent=grid.classList.contains('show-grid')?'Скрыть сетку 12×12':'Показать сетку 12×12'};['#f1f3f6','#24272e','#171a1f','#2f7fd7','#55b24c','#e8453c','#ffd21c','#735cff','#e60012','#9aa4b2','#ff6b9d','#24c7d9'].forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=()=>{color.value=c;custom=c;all()};document.getElementById('quick').appendChild(b)});rm();rs();all()})();
</script></body></html>
