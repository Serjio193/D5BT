<defs>
  <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    #neon-run {
      stroke-dasharray: 300 180;
      animation: neonRun 2.4s linear infinite, neonPulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes neonRun { to { stroke-dashoffset: -960; } }
    @keyframes neonPulse { from { opacity:.45; } to { opacity:1; } }
    #dpad {
      transform-box: fill-box;
      transform-origin: center;
      animation: dpadSpin 4s linear infinite;
    }
    @keyframes dpadSpin { to { transform: rotate(360deg); } }
  </style>
</defs>

