<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D5BT — No SVG UI Concept</title>
<style>
:root{--bg:#070a0f;--panel:#0d121a;--panel2:#111823;--line:#263244;--text:#f5f7fb;--muted:#8995a7;--ok:#4be18f;--accent:#7d6cff;--danger:#ff5f67}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#18233c 0,#090d14 34%,var(--bg) 72%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}main{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.title{font-size:22px;font-weight:850}.sub{font-size:12px;color:var(--muted);margin-top:4px}.status{padding:9px 12px;border:1px solid #245c43;background:#0e2a1e;color:#78efae;border-radius:10px;font-weight:800;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.55fr);gap:14px}.panel{background:linear-gradient(180deg,#101722,#0b1119);border:1px solid var(--line);border-radius:18px;padding:16px}.section{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:#c9d3df;font-weight:850;margin-bottom:12px}.triggers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.trigger{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.bar{height:10px;background:#1c2634;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .12s}.controller{position:relative;min-height:470px;border:1px solid #1c2737;border-radius:16px;background:radial-gradient(circle at 50% 43%,rgba(125,108,255,.09),transparent 46%);overflow:hidden}.pad{position:absolute;left:50%;top:50%;width:610px;height:300px;transform:translate(-50%,-50%);border:2px solid #313b49;border-radius:44% 44% 37% 37% / 34% 34% 54% 54%;background:linear-gradient(180deg,#161c25,#10151c)}.grip{position:absolute;width:155px;height:210px;background:#121821;border:2px solid #313b49;bottom:-70px;border-radius:42%}.grip.l{left:28px;transform:rotate(16deg)}.grip.r{right:28px;transform:rotate(-16deg)}.dpad{position:absolute;left:105px;top:82px;width:112px;height:112px}.dpad button{position:absolute;border:0;background:#262e39;color:#dce3eb;border-radius:9px;cursor:pointer}.dpad button.active,.face button.active,.sys.active{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(125,108,255,.16)}.up,.down{width:38px;height:56px;left:37px}.up{top:0}.down{bottom:0}.left,.right{width:56px;height:38px;top:37px}.left{left:0}.right{right:0}.face{position:absolute;right:100px;top:75px;width:130px;height:130px}.face button{position:absolute;width:48px;height:48px;border:1px solid #485464;background:#222a35;color:#fff;border-radius:50%;font-weight:850;cursor:pointer}.face .y{left:41px;top:0}.face .b{right:0;top:41px}.face .a{left:41px;bottom:0}.face .x{left:0;top:41px}.touch{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:174px;height:72px;border:1px solid #3a4554;background:#1b222c;border-radius:14px;display:grid;place-items:center;color:#758195;font-size:11px}.sys{position:absolute;width:38px;height:26px;border:1px solid #3c4756;background:#202731;color:#8793a3;border-radius:8px;cursor:pointer}.sys.create{left:258px;top:70px}.sys.options{right:258px;top:70px}.sys.ps{left:50%;top:120px;transform:translateX(-50%);border-radius:50%;width:34px;height:34px}.stick{position:absolute;width:106px;height:106px;border:2px solid #3e4958;background:#151b23;border-radius:50%}.stick.left{left:220px;top:170px}.stick.right{right:220px;top:170px}.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:#343e4c;border:1px solid #566171;transition:transform .08s}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{padding:12px;border:1px solid #202b3b;border-radius:12px;background:#0b1119}.metric b{display:block;font-size:18px;margin-top:5px}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.side{display:grid;gap:14px;align-content:start}.test{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #1d2633}.test:last-child{border:0}.pass{color:var(--ok);font-weight:800}.controls{display:grid;gap:10px}.controls label{font-size:11px;color:var(--muted)}input[type=range]{width:100%}.btn{min-height:44px;border:1px solid #3b4656;background:#151c26;color:#e8edf4;border-radius:11px;font-weight:800;cursor:pointer}.btn:hover{border-color:#5b687b}@media(max-width:860px){.layout{grid-template-columns:1fr}.controller{min-height:420px}.pad{transform:translate(-50%,-50%) scale(.82)}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:10px}.top{align-items:flex-start}.controller{min-height:340px}.pad{transform:translate(-50%,-50%) scale(.62)}.metrics{grid-template-columns:1fr 1fr}.triggers{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top"><div><div class="title">D5BT Controller Tester</div><div class="sub">Концепт интерфейса без SVG · только CSS/HTML-примитивы</div></div><div class="status">CONNECTED</div></div>
<div class="layout">
<section class="panel">
<div class="section">Live controller</div>
<div class="triggers"><div class="trigger"><b>L2</b><div class="bar"><div class="fill" id="l2fill"></div></div><span id="l2v">0%</span></div><div class="trigger"><b>R2</b><div class="bar"><div class="fill" id="r2fill"></div></div><span id="r2v">0%</span></div></div>
<div class="controller"><div class="pad"><div class="grip l"></div><div class="grip r"></div><div class="touch">TOUCHPAD</div><button class="sys create" data-toggle>◧</button><button class="sys options" data-toggle>☰</button><button class="sys ps" data-toggle>PS</button><div class="dpad"><button class="up" data-toggle>▲</button><button class="down" data-toggle>▼</button><button class="left" data-toggle>◀</button><button class="right" data-toggle>▶</button></div><div class="face"><button class="y" data-toggle>△</button><button class="b" data-toggle>○</button><button class="a" data-toggle>×</button><button class="x" data-toggle>□</button></div><div class="stick left"><div class="knob" id="ls"></div></div><div class="stick right"><div class="knob" id="rs"></div></div></div></div>
<div class="metrics"><div class="metric"><span>Left stick</span><b id="lsv">X 0.00 · Y 0.00</b></div><div class="metric"><span>Right stick</span><b id="rsv">X 0.00 · Y 0.00</b></div><div class="metric"><span>Polling</span><b>998 Hz</b></div><div class="metric"><span>Drift</span><b>0.6%</b></div></div>
</section>
<aside class="side"><section class="panel"><div class="section">Input simulator</div><div class="controls"><label>L2<input id="l2" type="range" min="0" max="100" value="0"></label><label>R2<input id="r2" type="range" min="0" max="100" value="0"></label><label>Left stick X<input id="lsx" type="range" min="-100" max="100" value="0"></label><label>Left stick Y<input id="lsy" type="range" min="-100" max="100" value="0"></label><label>Right stick X<input id="rsx" type="range" min="-100" max="100" value="0"></label><label>Right stick Y<input id="rsy" type="range" min="-100" max="100" value="0"></label><button class="btn" id="reset">Reset</button></div></section><section class="panel"><div class="section">Automatic test</div><div class="test"><span>Buttons</span><span class="pass">PASS</span></div><div class="test"><span>Sticks</span><span class="pass">PASS</span></div><div class="test"><span>Triggers</span><span class="pass">PASS</span></div><div class="test"><span>Gyro</span><span class="pass">PASS</span></div><div class="test"><span>Battery</span><span>92%</span></div></section></aside>
</div>
</main>
<script>
const $=id=>document.getElementById(id);document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>b.classList.toggle('active')));function trig(id){const v=+$(id).value;$(id+'fill').style.width=v+'%';$(id+'v').textContent=v+'%'}function stick(prefix,el,out){const x=+$(prefix+'x').value/100,y=+$(prefix+'y').value/100;$(el).style.transform=`translate(calc(-50% + ${x*25}px),calc(-50% + ${y*25}px))`;$(out).textContent=`X ${x.toFixed(2)} · Y ${y.toFixed(2)}`}['l2','r2'].forEach(id=>$(id).addEventListener('input',()=>trig(id)));['lsx','lsy'].forEach(id=>$(id).addEventListener('input',()=>stick('ls','ls','lsv')));['rsx','rsy'].forEach(id=>$(id).addEventListener('input',()=>stick('rs','rs','rsv')));$('reset').addEventListener('click',()=>{['l2','r2','lsx','lsy','rsx','rsy'].forEach(id=>$(id).value=0);trig('l2');trig('r2');stick('ls','ls','lsv');stick('rs','rs','rsv');document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'))});trig('l2');trig('r2');stick('ls','ls','lsv');stick('rs','rs','rsv');
</script>
</body>
</html>
